name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # triggered by: pipe release
  pull_request:
    branches: [main]

env:
  GOWORK: "off"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Check go fix
        run: |
          OUTPUT=$(go fix -diff ./... 2>&1)
          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT"
            echo "::error::go fix found pending modernizations — run 'go fix ./...' locally"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go list ./... | grep -v /example/ | xargs go test -v -race -coverprofile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep ^total: | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=50
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

  mcp:
    name: MCP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Check go fix
        run: |
          OUTPUT=$(go fix -diff ./... 2>&1)
          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT"
            echo "::error::go fix found pending MCP modernizations - run 'cd mcp && GOWORK=off go fix ./...' locally"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Build
        run: go build -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Build
        run: go list ./... | grep -v /example/ | xargs go build -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - mcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-mode: goinstall
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, mcp, build, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so release notes span all commits

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes

  tag:
    name: Tag Version
    runs-on: ubuntu-latest
    needs: [test, mcp, build, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract module versions
        id: versions
        run: |
          ROOT_VERSION=$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' version.go)
          MCP_VERSION=$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' mcp/version.go)
          if [ -z "$ROOT_VERSION" ] || [ -z "$MCP_VERSION" ]; then
            echo "::error::Could not extract root and MCP module versions"
            exit 1
          fi
          echo "root_tag=v${ROOT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mcp_tag=mcp/v${MCP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected versions: root v${ROOT_VERSION}, MCP mcp/v${MCP_VERSION}"

      - name: Create and push missing tags
        env:
          ROOT_TAG: ${{ steps.versions.outputs.root_tag }}
          MCP_TAG: ${{ steps.versions.outputs.mcp_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for TAG in "$ROOT_TAG" "$MCP_TAG"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists; leaving it unchanged."
              continue
            fi
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          done
